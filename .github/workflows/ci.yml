name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消上一次未完成的 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 关键：actions/setup-go@v5 默认 GOTOOLCHAIN=auto 会下载最新 Go（1.26）
# 这会触发 2 个问题：
#   1. golangci-lint v1.61 用 Go 1.23 编译 → 报 "Go version 1.23 < 1.26" 错误
#   2. go test -coverprofile 触发 covdata 工具 → toolchain 切换后某些工具缺失
# 解决：设 GOTOOLCHAIN=local 强制使用 setup-go 装的 Go 版本

jobs:
  build:
    name: build (ubuntu/macos/windows × go 1.22/1.23)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

  test:
    name: test (ubuntu × go 1.23)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run unit tests
        # ⚠️ 不要 -coverprofile（需要 covdata 工具，toolchain 切换会失败）
        # 覆盖率用本地 `make test-coverage` 测
        run: go test -race -count=1 ./...

  lint:
    name: lint (ubuntu × go 1.23)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m

  smoke:
    name: smoke (ubuntu × go 1.23) — build + start + curl /health
    runs-on: ubuntu-latest
    needs: [build, test]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binary
        run: go build -o bin/novel2all ./cmd/server

      - name: Start server (background)
        run: |
          ./bin/novel2all &
          SERVER_PID=$!
          sleep 3
          echo "PID=$SERVER_PID"

      - name: Curl health
        run: |
          curl -sf http://localhost:8000/health || (echo "health check failed" && exit 1)
          curl -sf http://localhost:8000/version || (echo "version check failed" && exit 1)