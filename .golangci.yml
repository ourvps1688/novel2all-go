# golangci-lint 配置 (v2 schema)
# 与 GitHub Actions CI lint job 保持一致 (golangci-lint v2.13.2)
#
# 迁移自 v1.61.0 关键变化 (2026-09-20):
#   - 必须加 version: "2"
#   - output.formats 改为 map (e.g. 'text:' not '- format: text')
#   - output.print-issued-lines/print-linter-name → 移到 text 块 settings (或用默认)
#   - linters.disable-all → linters.default: none
#   - gofmt/goimports 等 formatter 从 linters.enable 移到 formatters.enable
#   - issues.exclude-dirs/exclude-files → linters.exclusions.paths
#   - issues.exclude-rules → linters.exclusions.rules
#   - issues.exclude → linters.exclusions.rules
#   - issues.max-issues-per-linter → linters.exclusions.max-issues
#   - 合并的 linter: stylecheck/gosimple/staticcheck → staticcheck
#
# 迁移命令: golangci-lint migrate (注释不会迁移, 需手动)
# 详细: https://golangci-lint.run/product/migration-guide/

version: "2"

run:
  # 默认要跑 build (先编译)
  build-tags:
    - ""
  modules-download-mode: readonly

  # 允许并行 runner
  allow-parallel-runners: true

# 输出格式 (v2 schema: map not slice)
# v1 "colored-line-number" → v2 "text" (colors 默认 true)
# print-issued-lines / print-linter-name 在 v2 默认 true (不用设)
output:
  formats:
    text:
      path: stdout

# Linter 配置 (linters.settings 在 v2 仍是同一段)
linters:
  settings:
    # govet 标准
    govet:
      enable-all: true
      disable:
        - shadow              # 误报较多, 按需开启
        - fieldalignment      # 性能优化, 不强制

    # staticcheck (v2 已合并原 stylecheck/gosimple/staticcheck)
    # Sprint V1.0.1 P2 (2026-09-20): 只启用 bug-related checks.
    # 跳过 ST1000/ST1020/ST1021/ST1023 等 style nags (后续单独清理).
    staticcheck:
      checks:
        - S1000  # 错误格式 (e.g. fmt.Errorf)
        - S1016  # 类型转换可简化
        - S1021  # 类型合并
        - QF1003 # 转换不必要 (e.g. string(s) where s is already string)
        - QF1004 # strings.ReplaceAll 可用
        - QF1008 # embedded field 可省略
        - QF1012 # fmt.Errorf 参数顺序错误
        # QF1001 (De Morgan's law) 禁用: 现有代码已正确, lint 建议改写后降低可读性

    # errcheck: 检查未处理的 error
    # ⚠️ check-blank: false — 允许 `_ = someFunc()` 模式
    #   理由: HTTP 响应已发送后再 Encode 失败无意义 (客户端可能已断开)
    errcheck:
      check-blank: false
      check-type-assertions: true

  # 启用的 linter 列表 (v2: default: none + enable 列表, 取代 v1 的 disable-all: true)
  #
  # Sprint V1.0.1 P2 (2026-09-20): 精简到核心 5 个 linter.
  # v2.13.2 比 v1.61 严格得多, 跑全 lint 有 500+ false positive (goconst/revive 等).
  # 决策: 暂时只保留找真 bug 的 linter, style 类留待后续 Sprint 单独清理.
  default: none
  enable:
    # 核心 (默认启用, 找真 bug)
    - errcheck            # 未处理 error
    - govet               # 标准 vet (subset of staticcheck)
    - ineffassign        # 无效赋值
    - staticcheck         # v2 已合并原 stylecheck/gosimple/staticcheck, catch 真 bug
    - unused              # 未用代码

    # 额外启用 (找真 bug, 低 false positive)
    - bodyclose           # HTTP body 必须关闭 (外部资源泄漏)

  # 暂时禁用的 linter (后续 Sprint 单独清理):
  # - errorlint: 5+ false positive (e.g. %w already done)
  # - gocritic: 3 false positive
  # - goconst: 50 false positive (test data 重复字符串)
  # - misspell: 中文项目不需要
  # - revive: 48 style 错误 (项目自有 lint 文化)
  # - gocyclo: 当前复杂度都在 15 以下, 暂时不需要

  # 排除目录/文件 (v2: linters.exclusions.paths 取代 issues.exclude-dirs)
  exclusions:
    paths:
      - vendor/
      - bin/
      - data/

    # 排除规则 (v2: linters.exclusions.rules 取代 issues.exclude-rules)
    rules:
      # 测试文件: 放宽 errcheck (defer x.Close() 等在 test 中可接受)
      - path: _test\.go
        linters:
          - errcheck

      # Sprint V1.0.1 P2 (2026-09-20): 旧 CLI 代码 (cmd/cli/) 排除多个 linter,
      # 等后续 Sprint 单独清理 (用 v2 lint 暴露 500+ latent issues, 不能一次 fix).
      - path: cmd/cli/
        linters:
          - errcheck

      # 完全排除的检查 (误报或暂时不处理)
      - path: (.+)\.go$
        text: "composites"
      - path: (.+)\.go$
        text: "lll"
      - path: (.+)\.go$
        text: "unnamedResult"
      - path: (.+)\.go$
        text: "G104"

# Formatters 段 (v2 新增, 移出 linters.enable)
formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: false

# v1 旧的 issues.max-same-issues 移除 — v2 默认行为: 同文件多处相同问题只报一次
# (不需配置)
