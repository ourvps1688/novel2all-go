# golangci-lint 配置
# 与 GitHub Actions CI lint job 保持一致（v1.61.0）
#
# 用法：
#   golangci-lint run                 # 跑所有启用规则
#   golangci-lint run --fix           # 自动修复（gofmt/gosimple 等）
#   golangci-lint run ./internal/...  # 跑子目录

run:
  # 超时（CI 用 5m）
  timeout: 5m

  # 允许并行 runner
  allow-parallel-runners: true

  # 默认要跑 build（先编译）
  # 注意：v1.61+ 用 issues.exclude-dirs/files 而不是 run.skip-dirs/files
  build-tags:
    - ""
  modules-download-mode: readonly

# 输出格式
output:
  formats:
    - format: colored-line-number
      path: stdout
  print-issued-lines: true
  print-linter-name: true

# Linter 配置
linters-settings:
  # govet 标准
  govet:
    enable-all: true
    disable:
      - shadow       # 误报较多，按需开启
      - fieldalignment # 性能优化，不强制

  # staticcheck
  staticcheck:
    checks: ["all"]

  # errcheck：检查未处理的 error
  errcheck:
    check-blank: true
    check-type-assertions: true

  # gosimple：代码简化建议（含 S1008 等）
  gosimple:
    checks: ["all"]

  # revive：替代 golint，更现代的 style 检查
  # ⚠️ rule 名字必须用 enum 列出的：var-naming / dot-imports / exported / if-return / 等
  revive:
    rules:
      - name: var-naming
      - name: package-comments
      - name: exported
      - name: dot-imports
      - name: error-return       # ⚠️ 不是 error-returned
      - name: error-strings
      - name: if-return
      - name: redundant-import-alias  # ⚠️ 不是 redundant-import-aliases

  # gocritic：额外风格检查
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam
      - rangeValCopy

  # gocyclo：圈复杂度（避免函数过长）
  gocyclo:
    min-complexity: 15

  # misspell：拼写检查
  misspell:
    locale: US
    ignore-words:
      - cancelled

  # goconst：重复字符串 → 常量
  goconst:
    min-len: 3
    min-occurrences: 3

  # errorlint：用 %w 包装 error
  errorlint:
    asserts: true
    comparison: true

# 启用的 linter 列表
linters:
  disable-all: true
  enable:
    # 默认（golangci-lint 默认启用的）
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # 额外启用
    - bodyclose     # HTTP body 必须关闭（不在 linters-settings 下）
    - errorlint     # %w 包装
    - gocritic      # 风格/性能
    - gocyclo       # 圈复杂度
    - goconst       # 重复字面量
    - misspell      # 拼写
    - revive        # 风格
    - gofmt         # 格式
    - goimports     # import 排序

# 严重级别问题
issues:
  # 同文件多处相同问题 → 只报一次
  max-same-issues: 5

  # 0 issue 政策（max-issues-per-linter 已合并所有 per-dir）
  max-issues-per-linter: 0

  # 排除目录/文件（v1.61+ 用 exclude-* 不是 skip-*）
  exclude-dirs:
    - vendor
    - bin
    - data
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_mock\\.go$"

  # 排除规则
  exclude-rules:
    # 测试文件放宽要求
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - goconst
        - revive
      text: "should have comment|exported"

    # examples 放宽
    - path: examples/
      linters:
        - gocyclo
        - revive

  # 完全排除的检查（误报或暂时不处理）
  exclude:
    - "composites"  # interface 兼容
    - "lll"         # 行长度